        token: { type: string }
        symbol: { type: string }
        balance: { type: number }
        valueUsd: { type: number }
        avgCostUsd: { type: number }
        realizedPnlUsd: { type: number }
        unrealizedPnlUsd: { type: number }

    PerpsBucket:
