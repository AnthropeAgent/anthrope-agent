        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Pemakaian kredit harian per endpoint }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: session }
    apiKey: { type: apiKey, in: header, name: X-API-KEY }

  parameters:
    Chain: { name: chain, in: path, required: true, schema: { type: string, example: solana } }
    Address: { name: address, in: path, required: true, schema: { type: string } }
    ChainFilter: { name: chain, in: query, schema: { type: string, default: all } }
    Timeframe: { name: tf, in: query, schema: { type: string, enum: ['5m', '1h', '4h', '24h'], default: '24h' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }

  responses:
    NotFound:
      description: Tidak ditemukan
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: TOKEN_NOT_FOUND }
            message: { type: string }

    PctChange:
      type: object
      properties:
        '5m': { type: [number, 'null'] }
        '1h': { type: [number, 'null'] }
        '4h': { type: [number, 'null'] }
        '24h': { type: [number, 'null'] }

    Token:
      description: Bentuk sama dengan `Token` di src/lib/data/types.ts.
      type: object
      required: [chain, address, symbol, name, price, marketCap, liquidity, updatedAt, stale]
      properties:
        chain: { type: string }
        address: { type: string }
        symbol: { type: string }
        name: { type: string }
        logoUrl: { type: [string, 'null'] }
        ageMinutes: { type: number }
        price: { type: number }
        priceNative: { type: number }
        marketCap: { type: number }
        fdv: { type: number }
        liquidity: { type: number }
        volume24h: { type: number }
        buyVolume24h: { type: [number, "null"], description: "null jika sumber data tidak memisahkan volume beli/jual (Mode A gratis)" }
        sellVolume24h: { type: [number, "null"] }
        txns24h: { type: integer }
        buys24h: { type: integer }
        sells24h: { type: integer }
        traders24h: { type: [integer, "null"] }
        change: { $ref: '#/components/schemas/PctChange' }
        holders: { type: [integer, 'null'] }
        top10Pct: { type: [number, 'null'] }
        maxSupply: { type: number }
        circulating: { type: number }
        markets: { type: [integer, "null"], description: "Jumlah pool aktif; null jika sumber tidak memberi jumlahnya" }
        verified: { type: boolean }
        isRwa: { type: boolean }
        launchpad: { type: [string, 'null'] }
        socials: { type: object, properties: { website: { type: string, format: uri }, x: { type: string, format: uri }, telegram: { type: string, format: uri } } }
        source: { type: string, description: "Asal data, misal dexscreener+geckoterminal" }
        mainPool: { type: [string, 'null'], description: Pool terlikuid; sumber chart & trades di Mode A }
        security: { $ref: '#/components/schemas/SecuritySummary' }
        updatedAt: { type: string, format: date-time }
        stale: { type: boolean }

    SecuritySummary:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        mintRevoked: { type: [boolean, 'null'] }
        freezeRevoked: { type: [boolean, 'null'] }
        lpBurnedPct: { type: [number, 'null'] }
        honeypot: { type: [boolean, 'null'] }
        buyTax: { type: [number, 'null'] }
        sellTax: { type: [number, 'null'] }

    Security:
      allOf:
        - { $ref: '#/components/schemas/SecuritySummary' }
        - type: object
          properties:
            devHoldingPct: { type: [number, 'null'] }
            flags: { type: array, items: { type: string } }
            scannedAt: { type: string, format: date-time }

    TrenchToken:
      allOf:
        - { $ref: '#/components/schemas/Token' }
        - type: object
          properties:
            stage: { type: string, enum: [created, final_stretch, migrated] }
            bondingPct: { type: number }

    SeriesMeta:
      type: object
      required: [updatedAt, stale, pending, pool]
      properties:
        updatedAt: { type: [string, 'null'], format: date-time }
        stale: { type: boolean, description: 'true jika data > 10 menit atau belum ada' }
        pending: { type: boolean, description: 'true jika data belum pernah diambil; coba lagi sesuai Retry-After' }
        pool: { type: [string, 'null'], description: Pool asal data }

    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, description: unix seconds (awal bar) }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }

    Trade:
      type: object
      properties:
        id: { type: string, description: 'chain:txHash:evIndex' }
        time: { type: integer }
        side: { type: string, enum: [buy, sell] }
        priceUsd: { type: number }
        amountToken: { type: number }
        valueUsd: { type: number }
        maker: { type: string }
        txHash: { type: string }
        token: { type: string }
        final: { type: boolean }

    Holder:
      type: object
      properties:
        rank: { type: integer }
        address: { type: string }
        label: { type: [string, 'null'] }
        pct: { type: number }
        amount: { type: number }
        valueUsd: { type: number }

    Pool:
      type: object
      properties:
        address: { type: string }
        dex: { type: string }
        quoteToken: { type: string }
        liquidityUsd: { type: number }
        volume24h: { type: number }
        isPrimary: { type: boolean }

    TraderRow:
      type: object
      properties:
        rank: { type: integer }
        address: { type: string }
        label: { type: [string, 'null'] }
        pnlUsd: { type: number }
        roiPct: { type: number }
        winRate: { type: number }
        volumeUsd: { type: number }
        trades: { type: integer }
        lastActiveMin: { type: number }

    WalletSummary:
      type: object
      properties:
        address: { type: string }
        labels: { type: array, items: { type: string } }
        netWorthUsd: { type: number }
        realizedPnlUsd: { type: number }
        unrealizedPnlUsd: { type: number }
        winRate: { type: number }
        trades30d: { type: integer }

    Position:
      type: object
      properties:
        chain: { type: string }
        token: { type: string }
        symbol: { type: string }
        balance: { type: number }
        valueUsd: { type: number }
        avgCostUsd: { type: number }
        realizedPnlUsd: { type: number }
        unrealizedPnlUsd: { type: number }

    PerpsBucket:
      type: object
      properties:
        range: { type: string }
        group: { type: string }
        wallets: { type: integer }
        inPositions: { type: integer }
        long: { type: number }
        short: { type: number }
        itm: { type: number }
        underwater: { type: number }
        leverage: { type: number }

    Article:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        bodyMd: { type: string, description: Hanya di endpoint detail }
        category: { type: string, enum: [blog, flagship-reports, insight-articles] }
        tags: { type: array, items: { type: string } }
        coverUrl: { type: [string, 'null'] }
        pdfUrl: { type: [string, 'null'] }
        date: { type: string, format: date }
        readMin: { type: integer }
        featured: { type: boolean }

    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        role: { type: string, enum: [user, pro, peak, admin] }
        wallets: { type: array, items: { type: object, properties: { chainKind: { type: string }, address: { type: string } } } }
        preferences: { type: object }

    WatchlistItem:
      type: object
      required: [kind, chain, address]
      properties:
        kind: { type: string, enum: [token, wallet] }
        chain: { type: string }
        address: { type: string }
        note: { type: string }

    AlertRule:
      type: object
      required: [kind, chain, target, params]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [price_above, price_below, pct_change, volume_spike, wallet_activity, new_listing] }
        chain: { type: string }
        target: { type: string }
        params: { type: object }
        channels: { type: array, items: { type: string, enum: [web, telegram, email] } }
        cooldownSec: { type: integer, minimum: 60 }
        active: { type: boolean }

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        plan: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
