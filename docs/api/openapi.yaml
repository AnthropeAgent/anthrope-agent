        id: { type: string, format: uuid }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        role: { type: string, enum: [user, pro, peak, admin] }
        wallets: { type: array, items: { type: object, properties: { chainKind: { type: string }, address: { type: string } } } }
        preferences: { type: object }

    WatchlistItem:
