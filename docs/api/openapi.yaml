      properties:
        range: { type: string }
        group: { type: string }
        wallets: { type: integer }
        inPositions: { type: integer }
        long: { type: number }
        short: { type: number }
        itm: { type: number }
        underwater: { type: number }
        leverage: { type: number }

    Article:
