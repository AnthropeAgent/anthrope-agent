        chain: { type: string }
        target: { type: string }
        params: { type: object }
        channels: { type: array, items: { type: string, enum: [web, telegram, email] } }
        cooldownSec: { type: integer, minimum: 60 }
        active: { type: boolean }

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        plan: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
 } }
