        tags: { type: array, items: { type: string } }
        coverUrl: { type: [string, 'null'] }
        pdfUrl: { type: [string, 'null'] }
        date: { type: string, format: date }
        readMin: { type: integer }
        featured: { type: boolean }

    Me:
