openapi: 3.1.0
info:
  title: Platform API
  version: 1.0.0-draft
  description: |
    REST API untuk Terminal, Peak, Research, dan Public Data API (Fase 2 design).
    Semua endpoint ada di domain yang sama dengan web: `/api/v1`.

    - Akses dari web memakai cookie sesi (`session`).
    - Akses Public Data API memakai header `X-API-KEY` (dikenai kredit dan rate limit per tier).
    - Angka USD dikirim sebagai number; jumlah token mentah (raw units) sebagai string desimal.
    - Respons data pasar menyertakan `updatedAt` dan `stale`.
servers:
  - url: /api/v1

tags:
  - name: Market
  - name: Trenches
  - name: Wallets
  - name: Perps
  - name: Search
  - name: Swap
  - name: Auth
  - name: User
  - name: Content
  - name: Peak
  - name: Developer

security:
  - session: []
  - apiKey: []

paths:
  # ------------------------------------------------------------------ MARKET
  /tokens:
    get:
      tags: [Market]
      summary: Daftar token untuk Discover (Top MC, Trending, RWAs, New)
      security: [{}, {session: []}, {apiKey: []}]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [top-mc, trending, rwas, new], default: trending } }
        - { $ref: '#/components/parameters/ChainFilter' }
        - { $ref: '#/components/parameters/Timeframe' }
        - { name: minLiquidity, in: query, schema: { type: number } }
        - { name: minMarketCap, in: query, schema: { type: number } }
        - { name: minVolume, in: query, schema: { type: number } }
        - { name: verifiedOnly, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, updatedAt]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Token' } }
                  nextCursor: { type: [string, 'null'] }
                  updatedAt: { type: string, format: date-time }

  /tokens/{chain}/{address}:
    get:
      tags: [Market]
      summary: Detail token (header, statistik, security ringkas)
      security: [{}, {session: []}, {apiKey: []}]
      parameters: [{ $ref: '#/components/parameters/Chain' }, { $ref: '#/components/parameters/Address' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /tokens/{chain}/{address}/ohlcv:
    get:
      tags: [Market]
      summary: Candle OHLCV
      description: |
        Mode A (provider bridge): candle dari pool utama token (`Token.mainPool`) lewat GeckoTerminal,
        maks 300 bar per interval. Interval 1s/5s butuh indexer sendiri → 400 INTERVAL_NOT_SUPPORTED.
        Data diambil worker hanya untuk token yang sedang dibuka; request pertama bisa berisi
        `items: []` dengan `pending: true` dan header `Retry-After`.
      security: [{}, {session: []}, {apiKey: []}]
      parameters:
        - { $ref: '#/components/parameters/Chain' }
        - { $ref: '#/components/parameters/Address' }
        - { name: interval, in: query, required: true, schema: { type: string, enum: ['1s', '5s', '1m', '5m', '15m', '1h', '4h', '1d'] } }
        - { name: from, in: query, schema: { type: integer, description: unix seconds } }
        - { name: to, in: query, schema: { type: integer, description: unix seconds } }
        - { name: unit, in: query, schema: { type: string, enum: [price, mcap], default: price } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Candle' } }
                      interval: { type: string }
                  - { $ref: '#/components/schemas/SeriesMeta' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'unit=mcap tapi market cap token belum diketahui (MCAP_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /tokens/{chain}/{address}/trades:
    get:
      tags: [Market]
      summary: Transaksi terbaru token
      description: Mode A — maks 300 transaksi terakhir (24 jam) di pool utama token, terbaru dulu. Pola `pending` sama dengan /ohlcv.
      security: [{}, {session: []}, {apiKey: []}]
      parameters:
        - { $ref: '#/components/parameters/Chain' }
        - { $ref: '#/components/parameters/Address' }
        - { name: side, in: query, schema: { type: string, enum: [buy, sell] } }
        - { name: minValueUsd, in: query, schema: { type: number } }
        - { name: maker, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Trade' } }
                      nextCursor: { type: [string, 'null'] }
                  - { $ref: '#/components/schemas/SeriesMeta' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tokens/{chain}/{address}/holders:
    get:
      tags: [Market]
      summary: Top 100 holder dan konsentrasi (langkah 7)
      description: |
        Request menandai token sebagai "dilihat"; worker memindai (GoPlus, fallback Solana RPC) bila snapshot > 5 menit.
        Selama belum ada data → items kosong, pending true (coba lagi ±10 dtk). top10Pct tidak menghitung LP, burn, saldo terkunci.
      parameters: [{ $ref: '#/components/parameters/Chain' }, { $ref: '#/components/parameters/Address' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  holderCount: { type: [integer, 'null'] }
                  top10Pct: { type: [number, 'null'] }
                  items: { type: array, items: { $ref: '#/components/schemas/Holder' } }
                  source: { type: [string, 'null'], enum: [goplus, solana-rpc, null] }
                  updatedAt: { type: [string, 'null'], format: date-time }
                  stale: { type: boolean }
                  pending: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /tokens/{chain}/{address}/security:
    get:
      tags: [Market]
      summary: Hasil security scan (langkah 7)
      description: |
        {report, pending}. report = {score 0-100 | null, risk low|medium|high|unknown, checks [{key, label, status ok|warn|danger|unknown, value}],
        flags, summary (bentuk Token.security), holderCount, top10Pct, creator, owner, source, scannedAt}. Bukan audit.
      parameters: [{ $ref: '#/components/parameters/Chain' }, { $ref: '#/components/parameters/Address' }]
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /tokens/{chain}/{address}/markets:
    get:
      tags: [Market]
      summary: Daftar pool tempat token diperdagangkan
      parameters: [{ $ref: '#/components/parameters/Chain' }, { $ref: '#/components/parameters/Address' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Pool' } }

  /tokens/{chain}/{address}/dev-tokens:
    get:
      tags: [Market]
      summary: Token lain yang dibuat oleh deployer yang sama
      parameters: [{ $ref: '#/components/parameters/Chain' }, { $ref: '#/components/parameters/Address' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  creator: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/Token' } }

  # ---------------------------------------------------------------- TRENCHES
  /trenches/{chain}:
    get:
      tags: [Trenches]
      summary: Token launchpad per tahap (created, final_stretch, migrated)
      parameters:
        - { $ref: '#/components/parameters/Chain' }
        - { name: launchpad, in: query, schema: { type: string } }
        - { name: stage, in: query, schema: { type: string, enum: [created, final_stretch, migrated] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrenchToken' } }

  # ----------------------------------------------------------------- WALLETS
  /trenches/{chain}:
    get:
      tags: [Markets]
      summary: Trenches pump.fun per tahap (langkah 9, hanya solana)
      parameters: [{ name: chain, in: path, required: true, schema: { type: string, enum: [solana] } }]
      responses: { '200': { description: '{items: TrenchToken[] (stage new|final|migrated, bondingPct), counts, updatedAt, pending, stale}' }, '404': { $ref: '#/components/responses/Error' } }
  /perps:
    get:
      tags: [Markets]
      summary: Perps Hyperliquid, pasar dan distribusi posisi (langkah 10)
      responses: { '200': { description: '{perps: PerpsDoc | null, pending, stale}' } }
  /status/data-sources:
    get:
      tags: [Markets]
      summary: Mode data per chain (langkah 15)
      responses: { '200': { description: '{chains: [{chain, mode, sources, indexer}], perps}' } }
  /me/alerts:
    get: { tags: [Account], summary: Daftar alert (login), responses: { '200': { description: '{items: AlertRule[], max}' }, '401': { $ref: '#/components/responses/Error' } } }
    post: { tags: [Account], summary: 'Buat alert {kind, chain, address, threshold, cooldownSec?}', responses: { '201': { description: AlertRule }, '400': { $ref: '#/components/responses/Error' } } }
  /me/alerts/{id}:
    patch: { tags: [Account], summary: 'Aktif/nonaktif {active}', parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: OK } } }
    delete: { tags: [Account], summary: Hapus alert, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: OK } } }
  /me/alerts/events:
    get: { tags: [Account], summary: Notifikasi alert terbaru, parameters: [{ name: after, in: query, schema: { type: integer } }], responses: { '200': { description: '{items: AlertEvent[]}' } } }
  /articles:
    get: { tags: [CMS], summary: Artikel terbit, parameters: [{ name: category, in: query, schema: { type: string, enum: [blog, flagship-reports, insight-articles] } }], responses: { '200': { description: '{items: Article[]}' } } }
  /articles/{slug}:
    get: { tags: [CMS], summary: Artikel terbit dengan isi Markdown, parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Article }, '404': { $ref: '#/components/responses/Error' } } }
  /admin/articles:
    get: { tags: [CMS], summary: Semua artikel (admin), responses: { '200': { description: '{items}' }, '403': { $ref: '#/components/responses/Error' } } }
    post: { tags: [CMS], summary: Buat artikel (admin), responses: { '201': { description: Artikel }, '409': { $ref: '#/components/responses/Error' } } }
  /admin/articles/{id}:
    put: { tags: [CMS], summary: Ubah artikel (admin), parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Artikel } } }
    delete: { tags: [CMS], summary: Hapus artikel (admin), parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: OK } } }
  /me/api-keys:
    get: { tags: [Data API], summary: Daftar API key + pemakaian bulan ini, responses: { '200': { description: '{items, max}' } } }
    post: { tags: [Data API], summary: 'Buat API key {name}; key asli hanya dikembalikan sekali', responses: { '201': { description: '{key, info}' }, '409': { $ref: '#/components/responses/Error' } } }
  /me/api-keys/{id}:
    delete: { tags: [Data API], summary: Cabut API key, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: OK } } }
  /billing:
    get: { tags: [Data API], summary: Paket & status billing (Stripe belum dikonfigurasi), responses: { '200': { description: '{configured, message, plans}' } } }

  /traders:
    get:
      tags: [Wallets]
      summary: Top traders global atau per token (langkah 8, dari transaksi terpantau)
      description: |
        PnL average cost dari deret trades yang dipantau worker (Mode A), bukan riwayat penuh wallet.
        Dengan token=chain:address, request juga menandai token supaya deret trades-nya diambil.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all] } }
        - { name: token, in: query, description: 'chain:address', schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TraderRow' } }
                  updatedAt: { type: [string, 'null'], format: date-time }
                  tokens: { type: integer, description: jumlah token yang ikut dihitung }
                  pending: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }

  /wallets/{address}:
    get:
      tags: [Wallets]
      summary: Profil wallet (net worth, holdings, PnL terpantau, aktivitas) (langkah 8)
      description: |
        Alamat Solana (base58) atau EVM (0x…, dicek di Base & BNB Chain). Request menandai wallet sebagai dibuka;
        worker mengisi profil dalam ±5–15 dtk dan me-refresh tiap 60 dtk selama dibuka. Sebelum itu → profile null, pending true.
        profile = {address, kind, netWorthUsd, holdings[], pnl {realizedUsd, unrealizedUsd, totalUsd, winRate, tokensTraded, volumeUsd},
        tokens[] (PnL per token), activity[] (trade terbaru), notes[] (keterbatasan data), updatedAt}.
      parameters: [{ name: address, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{profile, pending, stale}' }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------- PERPS
  /perps/distribution:
    get:
      tags: [Perps]
      summary: Distribusi posisi perps per PnL, equity, winrate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pnl: { type: array, items: { $ref: '#/components/schemas/PerpsBucket' } }
                  equity: { type: array, items: { $ref: '#/components/schemas/PerpsBucket' } }
                  winrate: { type: array, items: { $ref: '#/components/schemas/PerpsBucket' } }
                  updatedAt: { type: string, format: date-time }

  /perps/heatmap:
    get:
      tags: [Perps]
      parameters:
        - { name: x, in: query, schema: { type: string, enum: [equity, winrate, pnl, asset, oi], default: equity } }
        - { name: y, in: query, schema: { type: string, enum: [equity, winrate, pnl, asset, oi], default: winrate } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cells: { type: array, items: { type: object, properties: { x: { type: string }, y: { type: string }, longUsd: { type: number }, shortUsd: { type: number } } } }

  # ------------------------------------------------------------------ SEARCH
  /search:
    get:
      tags: [Search]
      summary: Cari token berdasarkan simbol, nama (fuzzy), atau alamat
      description: |
        Teks: kandidat dari Meilisearch (atau fallback Postgres pg_trgm), diurutkan alamat persis > simbol persis >
        awalan simbol > nama > mengandung > fuzzy, lalu likuiditas, lalu volume 24h.
        Alamat (0x… / base58) dicari langsung di cache; bila belum ada, worker diminta mengambilnya dan alamat
        dikembalikan di `pending` (cari ulang beberapa detik lagi).
      security: [{}]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: chain, in: query, schema: { type: string, description: "chain id atau all" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tokens, wallets, pending]
                properties:
                  tokens: { type: array, items: { $ref: '#/components/schemas/Token' } }
                  wallets: { type: array, description: "Belum diisi (index wallets di langkah 8)", items: { type: object, properties: { address: { type: string }, label: { type: string } } } }
                  pending:
                    type: array
                    description: Alamat valid yang belum di-cache dan sedang diambil worker
                    items: { type: object, properties: { chain: { type: string }, address: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------------- SWAP
  /swap/quote:
    post:
      tags: [Swap]
      summary: Quote Buy (native → token) / Sell (token → native) dari Jupiter (Solana) atau KyberSwap (Base, BNB Chain)
      security: [{}, {session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain, side, token, amount]
              properties:
                chain: { type: string, enum: [solana, base, bsc] }
                side: { type: string, enum: [buy, sell] }
                token: { type: string }
                amount: { type: string, description: 'jumlah yang dibayar dalam satuan biasa, mis. "0.5"' }
                slippageBps: { type: integer, minimum: 1, maximum: 5000, default: 100 }
      responses:
        '200':
          description: Quote berlaku 30 detik
          content:
            application/json:
              schema:
                type: object
                properties:
                  quoteId: { type: string }
                  aggregator: { type: string, enum: [jupiter, kyberswap] }
                  inputToken: { type: string }
                  outputToken: { type: string }
                  amountIn: { type: string, description: raw units }
                  amountOut: { type: string }
                  minAmountOut: { type: string }
                  amountOutFormatted: { type: string }
                  minAmountOutFormatted: { type: string }
                  priceImpactPct: { type: number }
                  route: { type: array, items: { type: string } }
                  feeBps: { type: integer }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /swap/build:
    post:
      tags: [Swap]
      summary: Bangun transaksi belum ditandatangani + pemeriksaan + simulasi wajib
      description: |
        Server tidak pernah menandatangani atau mengirim. Transaksi diperiksa (Solana: fee payer = wallet,
        hanya program allowlist; EVM: router resmi KyberSwap, value sesuai) lalu disimulasikan.
        Saldo kurang / simulasi gagal → 422, transaksi tidak dikembalikan.
        EVM token ERC-20 dengan allowance kurang → needsApproval + approvalTx (sejumlah swap, bukan unlimited).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, wallet]
              properties:
                quoteId: { type: string }
                wallet: { type: string }
                priorityFee: { type: string, enum: [auto, low, medium, high], default: auto }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsApproval: { type: boolean }
                  approvalTx: { type: object, description: 'EVM {chainId, from, to, data, value}' }
                  orderId: { type: [string, 'null'], format: uuid }
                  kind: { type: string, enum: [solana, evm] }
                  unsignedTx: { description: 'base64 (Solana) atau objek tx EVM {chainId, from, to, data, value, gas}' }
                  simulation: { type: object, properties: { ok: { type: boolean }, expectedOut: { type: string }, minAmountOut: { type: string }, logs: { type: array, items: { type: string } } } }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /swap/track:
    post:
      tags: [Swap]
      summary: Catat signature/hash transaksi yang sudah dikirim wallet user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, txSignature]
              properties:
                orderId: { type: string, format: uuid }
                txSignature: { type: string }
      responses:
        '204': { description: Dicatat; worker memperbarui status }
        '409': { $ref: '#/components/responses/Error' }

  /swap/orders/{id}:
    get:
      tags: [Swap]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Order {status: built|submitted|confirmed|failed, txSignature, explorerUrl, ...}' }
        '404': { $ref: '#/components/responses/Error' }

  /swap/balance:
    get:
      tags: [Swap]
      parameters:
        - { name: chain, in: query, required: true, schema: { type: string, enum: [solana, base, bsc] } }
        - { name: wallet, in: query, required: true, schema: { type: string } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        '200': { description: 'Saldo native & token {raw, decimals, formatted}' }

  /me/swaps:
    get:
      tags: [Swap, User]
      responses:
        '200': { description: Riwayat swap user yang login (50 terakhir) }
        '401': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------------- AUTH
  /auth/nonce:
    post:
      tags: [Auth]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [address, chainKind], properties: { address: { type: string }, chainKind: { type: string, enum: [solana, evm] }, chainId: { type: integer, description: "EVM chain ID dari wallet (opsional, default 1)" } } }
      responses:
        '200':
          description: Pesan SIWS/SIWE untuk ditandatangani
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string }, nonce: { type: string }, expiresAt: { type: string, format: date-time } } }

  /auth/verify:
    post:
      tags: [Auth]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [message, signature], properties: { message: { type: string }, signature: { type: string } } }
      responses:
        '200': { description: Login berhasil, cookie sesi di-set, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /auth/email:
    post:
      tags: [Auth]
      security: [{}]
      summary: Kirim magic link
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '204': { description: Terkirim (respons sama walau email tidak terdaftar) }

  /auth/logout:
    post:
      tags: [Auth]
      responses:
        '204': { description: Sesi dihapus }

  # -------------------------------------------------------------------- USER
  /me:
    get:
      tags: [User]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [User]
      summary: Ubah preferensi (kolom tabel, layout token, preset swap)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: [string, 'null'], maxLength: 32 }
                preferences:
